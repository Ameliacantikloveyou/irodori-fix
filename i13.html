<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1, user-scalable=no"><title>BAB 14 amelia cantik Border</title>
<style>html,body{overscroll-behavior:none}body{margin:0;background:#000;color:#eee;min-height:100dvh;font-family:ui-monospace,monospace;display:flex;flex-direction:column;align-items:center;padding:12px 12px 40px;overflow:hidden}#hub{width:100%;max-width:440px;text-align:center;margin-top:2vh}#hub h2{color:#60a5fa;font-size:18px}#hub p{color:#666;font-size:10px;margin:8px 0 14px}.partBtn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;border:1.5px solid #333;background:#111;margin-top:10px;cursor:pointer;font-size:12px}.partBtn.full{border-color:#60a5fa;background:rgba(96,165,250,0.15);color:#60a5fa;font-weight:700}#app{width:100%;max-width:420px;display:none;flex-direction:column;align-items:center}#top{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;margin-top:4px}#top button{background:transparent;border:1px solid #2a2a2a;color:#666;border-radius:999px;padding:8px 14px;font-family:monospace;font-size:12px}#prog{color:#777;font-size:13px}#wrap{width:100%;aspect-ratio:3/4.6;perspective:1000px;touch-action:none;position:relative}#card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.35s}#card.flipped{transform:rotateY(180deg)}.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;background:#0a0a0a;border:1px solid #222;border-radius:28px;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;box-sizing:border-box;flex-direction:column}.back{transform:rotateY(180deg)}#jpF{font-weight:700;color:#fff;line-height:1.05}ruby rt{color:#60a5fa;font-weight:700;font-size:0.38em;padding-bottom:8px;letter-spacing:0.8px}#yomiB{color:#60a5fa;font-weight:700}#trB{color:#888;margin-top:8px;font-size:12px}.btns{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}button.action{padding:14px;border-radius:14px;background:#000;font-size:13px;border:1.5px solid;font-family:monospace}.b1{border-color:#fff;color:#fff}.b2{border-color:#22c55e;color:#22c55e}.b3{display:none!important}.b4{border-color:#ffeb00;color:#ffeb00}.bFuri{border-color:#60a5fa;color:#60a5fa;background:transparent}.bFuri.on{border-color:#60a5fa;color:#fff;background:#60a5fa;font-weight:700;box-shadow:0 0 14px rgba(96,165,250,0.6)}</style></head><body>
<div id=hub><button onclick="location.href='index.html'" style="background:transparent;border:1px solid #333;color:#666;border-radius:999px;padding:6px 12px;font-family:monospace;margin-bottom:12px">← HUB</button><h2 id=babTitle></h2><p id=babDesc></p><div id=partList></div></div>
<div id=app><div id=top><button onclick="showParts()">← PART</button><div id=prog></div><button onclick="location.href='index.html'">HUB</button></div><div id=wrap><div id=card onclick="flip()"><div class="face front"><div id=jpF></div></div><div class="face back"><div id=yomiB></div><div id=trB></div></div></div></div><div class=btns><button class="action b1" onclick="acak()">🎲 Acak</button><button class="action b2" onclick="hafal()">✅ Hafal</button><button class="action b4" onclick="speakNow()">🔊 発音</button><button id=furiBtn class="action bFuri" onclick="toggleFuri()">ふりがな OFF</button></div></div>
<script>
const FULL=[["公共","こうきょう","publik"],["施設","しせつ","fasilitas"],["図書館","としょかん","perpustakaan"],["美術館","びじゅつかん","museum seni"],["民俗資料館","みんぞくしりょうかん","museum rakyat"],["体育館","たいいくかん","gedung olahraga"],["スポーツジム","スポーツジム","pusat kebugaran"],["お風呂","おふろ","ruang berendam"],["入浴施設","にゅうよくしせつ","ruang mandi"],["インフォメーションコーナー","インフォメーションコーナー","pojok informasi"],["プラネタリウム","プラネタリウム","planetarium"],["物産コーナー","ぶっさんコーナー","pojok produk"],["市内","しない","dalam kota"],["パンフレット","パンフレット","pamflet"],["外国語","がいこくご","bahasa asing"],["CD","シーディー","CD"],["昔","むかし","dahulu"],["道具","どうぐ","alat"],["文化施設","ぶんかしせつ","pusat kebudayaan"],["建てる","たてる","mendirikan"],["メイン","メイン","utama"],["PC","ピーシー","PC"],["自由に","じゆうに","dengan bebas"],["展示する","てんじする","memamerkan"],["歴史","れきし","sejarah"],["利用する","りようする","menggunakan"],["室内用","しつないよう","dalam ruangan"],["オリエンテーション","オリエンテーション","orientasi"],["延長料金","えんちょうりょうきん","biaya perpanjangan"],["～につき","～につき","untuk setiap"],["かかる","かかる","biaya"],["下りる","おりる","turun"],["シューズ","シューズ","sepatu"],["マシン","マシン","mesin"],["トレーナー","トレーナー","pelatih"],["～ほど","～ほど","sekitar"],["受ける","うける","menerima"],["声をかける","こえをかける","menyapa"],["ご了承ください","ごりょうしょうください","Mohon dicatat"],["受けていただきます","うけていただきます","mohon ikut"],["絵","え","lukisan"],["さまざま","さまざま","berbagai macam"],["彫刻","ちょうこく","ukiran"],["画家","がか","pelukis"],["～を中心に","～をちゅうしんに","utamanya"],["セット券","セットけん","tiket terusan"],["フラッシュ","フラッシュ","blitz"],["券売機","けんばいき","mesin tiket"],["休憩室","きゅうけいしつ","lounge"],["ついている","ついている","termasuk"],["IT","アイティー","IT"],["利用者カード","りようしゃカード","kartu pengguna"],["プリントアウト","プリントアウト","print-out"],["インターネット","インターネット","internet"],["プリンター","プリンター","printer"],["空いている","あいている","kosong"],["確認する","かくにんする","mengecek"],["在留カード","ざいりゅうカード","izin tinggal"],["何冊","なんさつ","berapa buku"],["～冊","～さつ","jilid"],["合わせて","あわせて","total"],["～点","～てん","item"],["飲食禁止","いんしょくきんし","larangan makan"],["返す","かえす","mengembalikan"],["閉まる","しまる","tutup"],["返却ポスト","へんきゃくポスト","kotak pengembalian"],["開く","あく","buka"],["返却","へんきゃく","pengembalian"],["お読みください","およみください","Silakan baca"],["延ばす","のばす","memperpanjang"],["～のうち","～のうち","dalam"],["カセットテープ","カセットテープ","kaset"],["～禁止","～きんし","larangan"],["立入禁止","たちいりきんし","larangan masuk"],["関係者","かんけいしゃ","staf berwenang"],["～以外","～いがい","kecuali"],["預ける","あずける","menitipkan"],["お預けください","おあずけください","Silakan simpan"],["館内","かんない","dalam gedung"],["通話","つうわ","telepon"],["ご遠慮ください","ごえんりょください","Mohon tidak"],["お控えください","おひかえください","Mohon tidak"],["入館","にゅうかん","masuk gedung"],["入れ墨","いれずみ","tato"],["タトゥー","タトゥー","tato"],["シール","シール","stiker tato"],["ボディペイント","ボディペイント","body paint"],["お断りしています","おことわりしています","Kami menolak"]];
let O=[],D=[],i=0,furiOn=false,lastR=0,isRandom=false;
function showParts(){app.style.display='none';hub.style.display='block';speechSynthesis.cancel()}
function init(){const t=FULL.length;babTitle.textContent='BAB 14 - '+t+' KATA';babDesc.textContent='Furigana biru + garis biru';let h='<div class=partBtn full onclick="startBab(\'full\')"><b>⭐ FULL '+t+' KATA</b><span>></span></div>';let m=Math.ceil(t/3);h+='<div class=partBtn onclick="startBab(\'p1\')"><b>PART 1 (1-'+m+')</b><span>'+m+' ></span></div>';h+='<div class=partBtn onclick="startBab(\'p2\')"><b>PART 2 ('+(m+1)+'-'+(m*2)+')</b><span>'+m+' ></span></div>';h+='<div class=partBtn onclick="startBab(\'p3\')"><b>PART 3 ('+(m*2+1)+'-'+t+')</b><span>'+(t-m*2)+' ></span></div>';partList.innerHTML=h;updF()}
function updF(){let b=document.getElementById('furiBtn');b.textContent=furiOn?'ふりがな ON':'ふりがな OFF';b.className=furiOn?'action bFuri on':'action bFuri'}
window.toggleFuri=function(){furiOn=!furiOn;updF();render()}
function sz(t){return t.length<=2?86:t.length<=3?64:t.length<=5?48:t.length<=8?32:22}
function speakNow(){if(!D.length)return;let txt=isRandom?D[lastR][1]:D[i][1];speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(txt);u.lang='ja-JP';u.rate=0.9;speechSynthesis.speak(u)}
function render(){let k,y,tr;if(isRandom){prog.textContent='1 / '+D.length+' • BAB 14';k=D[lastR][0];y=D[lastR][1];tr=D[lastR][2]}else{prog.textContent=(i+1)+' / '+D.length+' • BAB 14';k=D[i][0];y=D[i][1];tr=D[i][2];lastR=i}jpF.style.fontSize=sz(k)+'px';if(furiOn && /[\u4e00-\u9faf]/.test(k) && y!==k){jpF.innerHTML='<ruby>'+k+'<rt style="color:#60a5fa;font-size:14px">'+y+'</rt></ruby>'}else{jpF.textContent=k}yomiB.textContent=y;trB.textContent=tr;card.classList.remove('flipped')}
window.flip=function(){card.classList.toggle('flipped')};window.startBab=function(m){if(m=='full')O=[...FULL];else if(m=='p1')O=FULL.slice(0,Math.ceil(FULL.length/3));else if(m=='p2')O=FULL.slice(Math.ceil(FULL.length/3),Math.ceil(FULL.length/3)*2);else O=FULL.slice(Math.ceil(FULL.length/3)*2);D=[...O];i=0;lastR=0;isRandom=false;hub.style.display='none';app.style.display='flex';render()}
window.acak=()=>{let r=Math.floor(Math.random()*D.length);if(r===lastR) r=(r+1)%D.length;lastR=r;isRandom=true;render()};
window.hafal=()=>{speechSynthesis.cancel();if(isRandom){D.splice(lastR,1);if(lastR>=D.length)lastR=0;i=lastR}else{D.splice(i,1);if(i>=D.length)i=0;lastR=i}if(!D.length){jpF.innerHTML="🎉<br>Wilujeung wayah kieu!";yomiB.textContent="";trB.textContent="Hafal semua!";prog.textContent="0 / 0";return}isRandom=false;render()};
let sy=0,cy=0,drag=false;const wrap=document.getElementById('wrap');wrap.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;drag=false},{passive:false});wrap.addEventListener('touchmove',e=>{if(!sy)return;cy=e.touches[0].clientY-sy;if(Math.abs(cy)>10){drag=true;e.preventDefault()}},{passive:false});wrap.addEventListener('touchend',()=>{if(!drag){sy=0;return}if(cy<-40){isRandom=false;i=(i+1)%D.length;lastR=i;render()}else if(cy>40){isRandom=false;i=(i-1+D.length)%D.length;lastR=i;render()}sy=0;cy=0;setTimeout(()=>drag=false,80)});
speechSynthesis.getVoices();init();
</script></body></html>
