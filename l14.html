<style>body{margin:0;background:#050505;color:#eee;min-height:100dvh;font-family:monospace;display:flex;flex-direction:column;align-items:center;padding:12px}#hub{width:100%;max-width:440px;text-align:center;margin-top:2vh}#hub h2{color:#ffeb00;font-size:18px}#hub p{color:#666;font-size:10px;margin:8px 0 14px}.partBtn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;border:1.5px solid #333;background:#111;margin-top:10px;cursor:pointer;font-size:12px}.partBtn.full{border-color:#ffeb00;background:rgba(255,235,0,0.15);color:#ffeb00;font-weight:700}#app{width:100%;max-width:400px;display:none;flex-direction:column;align-items:center;margin-top:1vh}#top{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}#top button{background:transparent;border:1px solid #333;color:#666;border-radius:8px;padding:6px 12px;font-family:monospace;font-size:11px}#prog{color:#666;font-size:11px}#wrap{width:100%;aspect-ratio:3/4.2;perspective:1000px}#card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.35s;cursor:pointer}#card.flipped{transform:rotateY(180deg)}.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;background:#111;border:1.5px solid #2a2a2a;border-radius:22px;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}.back{transform:rotateY(180deg);flex-direction:column}#jpF{font-weight:700;color:#fff}#yomiB{color:#ffeb00;font-weight:700}.dots{display:flex;gap:2px;margin-top:10px;flex-wrap:wrap;justify-content:center}.dot{width:3px;height:3px;border-radius:50%;background:#222}.dot.active{background:#ffeb00}.btns{width:100%;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}button.action{padding:12px;border-radius:10px;background:transparent;font-size:11px;border:1.5px solid;font-family:monospace}.b1{border-color:#fff;color:#fff}.b2{border-color:#22c55e;color:#22c55e}.b3{grid-column:1/ function showParts(){app.style.display='none';hub.style.display='block'}
function init(){const t=FULL.length;babTitle.textContent='BAB '+curBab+' - '+t+' KATA';babDesc.textContent='BAB 14 Layanan & Salon - Data Awal (full restore)';let h='<div class=partBtn full onclick="startBab(\'full\')"><b>⭐ FULL '+t+' KATA</b><span>></span></div>';let m=Math.ceil(t/3);h+='<div class=partBtn onclick="startBab(\'p1\')"><b>PART 1 (1-'+m+') Toko & Service</b><span>'+m+' ></span></div>';h+='<div class=partBtn onclick="startBab(\'p2\')"><b>PART 2 ('+(m+1)+'-'+(m*2)+') Paket & ATM</b><span>'+m+' ></span></div>';h+='<div class=partBtn onclick="startBab(\'p3\')"><b>PART 3 ('+(m*2+1)+'-'+t+') Salon & Konsul</b><span>'+(t-m*2)+' ></span></div>';partList.innerHTML=h;}
function sz(t){return t.length<=2?66:t.length<=3?52:t.length<=5?40:t.length<=8?28:19}function ysz(t){return t.length>14?14:t.length>9?18:24}function render(){prog.textContent=(i+1)+' / '+D.length+' - BAB '+curBab;jpF.textContent=D[i][0];jpF.style.fontSize=sz(D[i][0])+'px';yomiB.textContent=D[i][1];yomiB.style.fontSize=ysz(D[i][1])+'px';trB.textContent=D[i][2];card.classList.remove('flipped');dots.innerHTML='';for(let k=0;k<D.length;k++){let d=document.createElement('div');d.className='dot'+(k==i?' active':'');dots.appendChild(d)}}
