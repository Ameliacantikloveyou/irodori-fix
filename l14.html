function init(){const t=FULL.length;babTitle.textContent='BAB 14 - '+t+' KATA';babDesc.textContent='Furigana biru + garis biru';let h='<div class=partBtn full onclick="startBab(\'full\')"><b>⭐ FULL '+t+' KATA</b><span>></span></div>';let m=Math.ceil(t/3);h+='<div class=partBtn onclick="startBab(\'p1\')"><b>PART 1 (1-'+m+')</b><span>'+m+' ></span></div>';h+='<div class=partBtn onclick="startBab(\'p2\')"><b>PART 2 ('+(m+1)+'-'+(m*2)+')</b><span>'+m+' ></span></div>';h+='<div class=partBtn onclick="startBab(\'p3\')"><b>PART 3 ('+(m*2+1)+'-'+t+')</b><span>'+(t-m*2)+' ></span></div>';partList.innerHTML=h;updF()}
