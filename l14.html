<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAB 14 - Wilujeung Swipe</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;display:flex;flex-direction:column;min-height:100vh;align-items:center;justify-content:center}
.card-wrap{width:90vw;max-width:360px;perspective:1000px}
.card{width:100%;height:58vh;position:relative;transform-style:preserve-3d;transition:transform 0.35s ease;cursor:pointer;border:1px solid #333;border-radius:24px}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;border-radius:24px;padding:20px;text-align:center}
#front{background:#0a0a0a}
#back{background:#111;transform:rotateY(180deg)}
#jpF{font-size:48px;font-weight:700}
#jpFBack{font-size:36px;font-weight:700}
#yomiB{font-size:18px;color:#aaa;margin-top:12px}
#trB{font-size:14px;color:#888;margin-top:8px}
.dots{display:flex;gap:4px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:50%;background:#333}
.dot.active{background:#ff0}
.btns{display:flex;gap:10px;width:90vw;max-width:360px;margin-top:16px}
.btn{flex:1;padding:14px;border-radius:12px;border:1px solid #444;background:#000;color:#fff}
.btn.hafal{border-color:#22c55e;color:#22c55e}
.hint{font-size:11px;color:#555;margin-top:10px;text-align:center}
@keyframes fall{to{transform:translateY(100vh) rotate(360deg)}}
</style>
</head>
<body>
<div class="card-wrap">
<div class="card" id="card">
<div class="face" id="front"><div id="jpF"></div></div>
<div class="face" id="back"><div id="jpFBack"></div><div id="yomiB"></div><div id="trB"></div></div>
</div>
</div>
<div class="dots" id="dots"></div>
<div class="btns"><button class="btn" id="acakBtn">🎲 Acak</button><button class="btn hafal" id="hafalBtn">✅ Hafal</button></div>
<button class="btn" id="resetBtn" style="width:90vw;max-width:360px;margin-top:10px;opacity:0.5">↻ Reset</button>
<div class="hint">Tap = lihat arti<br>Swipe ATAS ⬆️ = kartu berikutnya<br>Swipe BAWAH ⬇️ = kartu sebelumnya<br><span id="prog"></span></div>
<script>
const curBab=14;
const FULL=[["美容院","びよういん","salon kecantikan"],["交差点","こうさてん","persimpangan"],["信号","しんごう","lampu lalu lintas"],["病院","びょういん","rumah sakit"],["薬局","やっきょく","apotek"]];
let D=[...FULL]; let i=0;
const jpF=document.getElementById('jpF');
const jpFBack=document.getElementById('jpFBack');
const yomiB=document.getElementById('yomiB');
const trB=document.getElementById('trB');
const prog=document.getElementById('prog');
const dots=document.getElementById('dots');
const card=document.getElementById('card');
function render(){
  if(!D.length){
    jpF.textContent="🎉";jpF.style.fontSize="70px";
    jpFBack.textContent="🎉";jpFBack.style.fontSize="70px";
    yomiB.textContent="Wilujeung wayah kieu!";
    yomiB.style.fontSize="22px";yomiB.style.color="#fff";
    trB.textContent="Alhamdulillah hafal BAB "+curBab+"! 🎉";
    prog.textContent="0 / 0";dots.innerHTML='';
    for(let c=0;c<25;c++){setTimeout(()=>{const e=document.createElement('div');e.textContent=['🎉','✨','🥳','🎊'][Math.floor(Math.random()*4)];e.style.position='fixed';e.style.left=Math.random()*100+'vw';e.style.top='-10px';e.style.fontSize='22px';e.style.animation='fall 2s linear';document.body.appendChild(e);setTimeout(()=>e.remove(),2000);},c*90);}
    return;
  }
  const [jp,yomi,tr]=D[i];
  jpF.textContent=jp;jpFBack.textContent=jp;
  yomiB.textContent=yomi;trB.textContent=tr;
  prog.textContent=(i+1)+" / "+D.length;
  dots.innerHTML=D.map((_,k)=>`<div class="dot ${k==i?'active':''}"></div>`).join('');
  card.classList.remove('flipped');
}
window.hafal=()=>{D.splice(i,1);if(!D.length){render();return;}if(i>=D.length)i=0;render();};
document.getElementById('acakBtn').onclick=()=>{i=Math.floor(Math.random()*D.length);render();};
document.getElementById('hafalBtn').onclick=()=>window.hafal();
document.getElementById('resetBtn').onclick=()=>{D=[...FULL];i=0;render();};
card.addEventListener('click',()=>card.classList.toggle('flipped'));
let startY=0;
card.addEventListener('touchstart',e=>{startY=e.touches[0].clientY;},{passive:true});
card.addEventListener('touchend',e=>{
  let endY=e.changedTouches[0].clientY;
  let diff=startY-endY;
  if(Math.abs(diff)>45){
    if(diff>0){i=(i+1)%D.length;render();}else{i=(i-1+D.length)%D.length;render();}
  }
},{passive:true});
render();
</script>
</body>
</html>
