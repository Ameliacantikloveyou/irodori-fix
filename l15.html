<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>BAB 15 - Mirip BAB 14</title>
<style>html,body{overscroll-behavior:none;overscroll-behavior-y:none}body{margin:0;background:#000;color:#eee;min-height:100dvh;font-family:ui-monospace,monospace;display:flex;flex-direction:column;align-items:center;padding:12px 12px 24px;overflow:hidden;touch-action:none}#hub{width:100%;max-width:440px;text-align:center;margin-top:2vh}#hub h2{color:#60a5fa;font-size:18px}#hub p{color:#666;font-size:10px;margin:8px 0 14px}.partBtn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;border:1.5px solid #333;background:#111;margin-top:10px;cursor:pointer;font-size:12px}.partBtn.full{border-color:#60a5fa;background:rgba(96,165,250,0.15);color:#60a5fa;font-weight:700}#app{width:100%;max-width:420px;display:none;flex-direction:column;align-items:center}#top{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;margin-top:4px}#top button{background:transparent;border:1px solid #2a2a2a;color:#666;border-radius:999px;padding:8px 14px;font-family:monospace;font-size:12px}#prog{color:#777;font-size:13px}#wrap{width:100%;aspect-ratio:3/4.4;perspective:1000px;touch-action:none;position:relative}#card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.35s}#card.flipped{transform:rotateY(180deg)}.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;background:#0a0a0a;border:1px solid #222;border-radius:28px;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;box-sizing:border-box;flex-direction:column}.back{transform:rotateY(180deg)}#jpF{font-weight:700;color:#fff;line-height:1.05;white-space:pre-line}ruby rt{color:#60a5fa;font-weight:700;font-size:0.38em;padding-bottom:8px;letter-spacing:0.8px}#yomiB{color:#60a5fa;font-weight:700;font-size:20px}#trB{color:#888;margin-top:8px;font-size:12px}.btns{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}button.action{padding:16px;border-radius:16px;background:#000;font-size:13px;border:1.5px solid;font-family:monospace}.b1{border-color:#fff;color:#fff}.b2{border-color:#22c55e;color:#22c55e}.b4{border-color:#ffeb00;color:#ffeb00}.bFuri{border-color:#60a5fa;color:#60a5fa;background:transparent}.bFuri.on{border-color:#60a5fa;color:#fff;background:#60a5fa;font-weight:700;box-shadow:0 0 14px rgba(96,165,250,0.6)}</style></head><body>
<div id=hub><button onclick="location.href='index.html'" style="background:transparent;border:1px solid #333;color:#666;border-radius:999px;padding:6px 12px;font-family:monospace;margin-bottom:12px">← HUB</button><h2 id=babTitle></h2><p id=babDesc></p><div id=partList></div></div>
<div id=app><div id=top><button onclick="showParts()">← PART</button><div id=prog></div><button onclick="location.href='index.html'">HUB</button></div><div id=wrap><div id=card onclick="flip()"><div class="face front"><div id=jpF></div></div><div class="face back"><div id=yomiB></div><div id=trB></div></div></div></div><div class=btns><button class="action b1" onclick="acak()">🎲 Acak</button><button class="action b2" onclick="hafal()">✅ Hafal</button><button class="action b4" onclick="speakNow()">🔊 Suara</button><button id=furiBtn class="action bFuri" onclick="toggleFuri()">ふりがな OFF</button></div></div>
<script>
const FULL=[["消す","けす","mematikan (lampu)"],["忘れずに","わすれずに","Jangan lupa (untuk) ~"],["クールビズ","クールビズ","Cool Biz"],["実施中","じっしちゅう","sedang berlangsung"],["軽装","けいそう","pakaian ringan"],["ノー～","ノー～","tanpa ~"],["設定","せってい","pengaturan"],["ご理解とご協力のほどよろしくお願いします","ごりかいとごきょうりょくのほどよろしくおねがいします","Mohon pengertian & kerja sama"],["節電","せつでん","penghematan listrik"],["両面印刷","りょうめんいんさつ","pencetakan dua sisi"],["マイバッグ","マイバッグ","tas belanja ramah lingkungan"],["レジ袋","レジぶくろ","tas plastik sekali pakai"],["有料化","ゆうりょうか","berbayar"],["持参","じさん","membawa"],["環境","かんきょう","lingkungan"],["エコ","エコ","ramah lingkungan"],["節電する","せつでんする","menghemat listrik"],["節水する","せっすいする","menghemat air"],["紙","かみ","kertas"],["節約する","せつやくする","menghemat"],["リサイクルする","リサイクルする","mendaur ulang"],["ごみ","ごみ","sampah"],["分別する","ぶんべつする","memilah"],["減らす","へらす","mengurangi"],["設定温度","せっていおんど","setelan temperatur"],["下げる","さげる","menurunkan"],["もったいない","もったいない","mubazir"],["缶","かん","kaleng"],["まとめる","まとめる","mengumpulkan"],["出す","だす","mengalirkan air"],["洗剤","せんざい","detergen"],["止める","とめる","mematikan air"],["すすぐ","すすぐ","membilas"],["ストロー","ストロー","sedotan"],["マイ～","マイ～","my ~ pribadi"],["持ち歩く","もちあるく","membawa"],["マイボトル","マイボトル","botol pribadi"],["ペットボトル","ペットボトル","botol plastik"],["資源","しげん","sumber daya"],["分け方","わけかた","cara memilah"],["出し方","だしかた","cara membuang"],["集積所","しゅうせきじょ","titik pengumpulan"],["収集日","しゅうしゅうび","hari pengumpulan"],["資源ごみ","しげんごみ","sampah daur ulang"],["～種類","～しゅるい","~ jenis"],["分ける","わける","memilah"],["ひも","ひも","tali"],["しばる","しばる","mengikat"],["新聞","しんぶん","koran"],["雑誌","ざっし","majalah"],["中身","なかみ","isi"],["びん","びん","botol kaca"],["キャップ","キャップ","tutup botol"],["ラベル","ラベル","label"],["つぶす","つぶす","menghancurkan"],["紙パック","かみパック","kemasan karton"],["切り開く","きりひらく","memotong terbuka"],["食品トレイ","しょくひんトレイ","nampan makanan"],["可燃ごみ","かねんごみ","sampah dapat dibakar"],["生ごみ","なまごみ","sampah sisa makanan"],["水を切る","みずをきる","mengeringkan"],["布","ぬの","kain"],["しみこませる","しみこませる","diserap"],["固める","かためる","dipadatkan"],["プラスチック","プラスチック","plastik"],["再生する","さいせいする","mendaur ulang"],["少量","しょうりょう","jumlah kecil"],["植木","うえき","tanaman"],["枝","えだ","cabang"],["葉","は","daun"],["使い古し","つかいふるし","bekas"],["凝固剤","ぎょうこざい","zat pemadat"],["ビニール","ビニール","vinil"],["～類","～るい","berjenis ~"],["ラップ","ラップ","plastik pembungkus"],["容器","ようき","wadah"],["発泡スチロール","はっぽうスチロール","styrofoam"],["不燃ごみ","ふねんごみ","sampah tidak dapat dibakar"],["割れる","われる","pecah"],["包む","つつむ","membungkus"],["危険","きけん","berbahaya"],["乾電池","かんでんち","baterai kering"],["刃物","はもの","pisau tajam"],["ガラス","ガラス","kaca"],["陶磁器","とうじき","porselen"],["電球","でんきゅう","bohlam"],["アルミ製品","アルミせいひん","aluminium"],["金属","きんぞく","logam"],["家電製品","かでんせいひん","peralatan elektronik"],["粗大ごみ","そだいごみ","sampah besar"],["家具","かぐ","furnitur"],["寝具","しんぐ","peralatan tidur"],["牛乳パック","ぎゅうにゅうパック","karton susu"],["使い切る","つかいきる","menghabiskan"],["燃える","もえる","dapat dibakar"],["取る","とる","dilepas"],["出す","だす","membuang sampah"],["粗大ごみ受付センター","そだいごみうけつけセンター","pusat penerimaan sampah besar"],["大きさ","おおきさ","ukuran"],["シール","シール","stiker"],["貼る","はる","menempel"]];
let O=[],D=[],i=0,furiOn=false;
function showParts(){app.style.display='none';hub.style.display='block';speechSynthesis.cancel()}
function init(){const t=FULL.length;babTitle.textContent='BAB 15 - '+t+' KATA';babDesc.textContent='Swipe atas/bawah • Anti refresh';let h='<div class=partBtn full onclick="startBab(\'full\')"><b>⭐ FULL '+t+' KATA</b><span>></span></div>';let m=Math.ceil(t/3);h+='<div class=partBtn onclick="startBab(\'p1\')"><b>PART 1 (1-'+m+')</b><span>'+m+' ></span></div>';h+='<div class=partBtn onclick="startBab(\'p2\')"><b>PART 2 ('+(m+1)+'-'+(m*2)+')</b><span>'+m+' ></span></div>';h+='<div class=partBtn onclick="startBab(\'p3\')"><b>PART 3 ('+(m*2+1)+'-'+t+')</b><span>'+(t-m*2)+' ></span></div>';partList.innerHTML=h;updF()}
function updF(){let b=document.getElementById('furiBtn');b.textContent=furiOn?'ふりがな ON':'ふりがな OFF';b.className=furiOn?'action bFuri on':'action bFuri'}
window.toggleFuri=function(){furiOn=!furiOn;updF();render()}
function sz(t){return t.length<=2?86:t.length<=3?64:t.length<=5?48:t.length<=8?32:22}
function speakNow(){if(!D.length)return;let txt=D[i][1];speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(txt);u.lang='ja-JP';u.rate=0.9;let vs=speechSynthesis.getVoices();let jp=vs.find(v=>v.lang.includes('ja'));if(jp)u.voice=jp;speechSynthesis.speak(u)}
function render(){if(!D.length){jpF.innerHTML="🎉\nwilujeung wayah kieu!";jpF.style.fontSize="32px";yomiB.textContent="";trB.textContent="Semua hafal!";prog.textContent="0 / 0";card.classList.remove('flipped');return}prog.textContent=(i+1)+' / '+D.length+' • BAB 15';let k=D[i][0], y=D[i][1];jpF.style.fontSize=sz(k)+'px';if(furiOn && /[\u4e00-\u9faf]/.test(k) && y!==k){jpF.innerHTML='<ruby>'+k+'<rt>'+y+'</rt></ruby>'}else{jpF.textContent=k}yomiB.textContent=y;trB.textContent=D[i][2];card.classList.remove('flipped')}
window.flip=function(){if(!D.length)return;card.classList.toggle('flipped')};window.startBab=function(m){if(m=='full')O=[...FULL];else if(m=='p1')O=FULL.slice(0,Math.ceil(FULL.length/3));else if(m=='p2')O=FULL.slice(Math.ceil(FULL.length/3),Math.ceil(FULL.length/3)*2);else O=FULL.slice(Math.ceil(FULL.length/3)*2);D=[...O];i=0;hub.style.display='none';app.style.display='flex';render()}
window.acak=()=>{if(!D.length)return;i=Math.floor(Math.random()*D.length);render()};window.hafal=()=>{speechSynthesis.cancel();if(!D.length)return;D.splice(i,1);if(!D.length){render();return}if(i>=D.length)i=0;render()};
let sy=0,cy=0,drag=false;const wrap=document.getElementById('wrap');wrap.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;drag=false},{passive:false});wrap.addEventListener('touchmove',e=>{if(!sy)return;cy=e.touches[0].clientY-sy;if(Math.abs(cy)>10){drag=true;e.preventDefault()}},{passive:false});wrap.addEventListener('touchend',()=>{if(!drag){sy=0;return}if(cy<-40){i=(i+1)%D.length;render()}else if(cy>40){i=(i-1+D.length)%D.length;render()}sy=0;cy=0;setTimeout(()=>drag=false,80)});document.body.addEventListener('touchmove',e=>{if(drag)e.preventDefault()},{passive:false});speechSynthesis.getVoices();init();
</script></body></html>
