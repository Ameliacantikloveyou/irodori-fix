<!DOCTYPE html><html lang=id><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>BAB 15</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&family=JetBrains+Mono:wght@400;700&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{background:#050505;color:#eee;min-height:100vh;font-family:'JetBrains Mono',monospace;display:flex;flex-direction:column;align-items:center;padding:12px}#hub{width:100%;max-width:440px;text-align:center;margin-top:2vh}#hub h2{color:#ffeb00;font-size:18px}#hub p{color:#666;font-size:10px;margin:8px 0 14px}.partBtn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;border:1.5px solid #333;background:#111;margin-top:10px;cursor:pointer;font-size:12px}.partBtn.full{border-color:#ffeb00;background:rgba(255,235,0,0.15);color:#ffeb00;font-weight:700}#app{width:100%;max-width:400px;display:none;flex-direction:column;align-items:center;margin-top:1vh}#top{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}#top button{background:transparent;border:1px solid #333;color:#666;border-radius:8px;padding:6px 12px;font-family:monospace;font-size:11px}#prog{color:#666;font-size:11px}#wrap{width:100%;aspect-ratio:3/4.2;perspective:1000px}#card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.35s;cursor:pointer}#card.flipped{transform:rotateY(180deg)}.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;background:#111;border:1.5px solid #2a2a2a;border-radius:22px;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}#jpF{font-family:'Noto Sans JP',sans-serif;font-weight:700;color:#fff;line-height:1.15}#yomiB{font-family:'Noto Sans JP',sans-serif;font-weight:700;color:#ffeb00;line-height:1.15}#trB{color:#888;margin-top:6px;font-size:11px}.back{transform:rotateY(180deg);flex-direction:column}.dots{display:flex;gap:2px;margin-top:10px;flex-wrap:wrap;justify-content:center}.dot{width:3px;height:3px;border-radius:50%;background:#222}.dot.active{background:#ffeb00}.btns{width:100%;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}button.action{padding:12px;border-radius:10px;background:transparent;font-size:11px;border:1.5px solid;font-family:monospace}.b1{border-color:#fff;color:#fff}.b2{border-color:#22c55e;color:#22c55e}.b3{grid-column:1/-1;border-color:#333;color:#444}</style></head><body><div id=hub><button onclick="location.href='index.html'" style="background:transparent;border:1px solid #333;color:#666;border-radius:8px;padding:6px 12px;font-family:monospace;margin-bottom:12px">← HUB</button><h2 id=babTitle></h2><p id=babDesc></p><div id=partList></div></div><div id=app><div id=top><button onclick="showParts()">← PART</button><div id=prog></div><button onclick="location.href='index.html'" style="width:60px;background:transparent;border:1px solid #222;color:#444;border-radius:8px;padding:4px">HUB</button></div><div id=wrap><div id=card><div class="face front"><div id=jpF></div></div><div class="face back"><div id=yomiB></div><div id=trB></div></div></div></div><div class=dots id=dots></div><div class=btns><button class="action b1" onclick="acak()">🎲 Acak</button><button class="action b2" onclick="hafal()">✅ Hafal</button><button class="action b3" onclick="resetAll()">↺ Reset</button></div></div><script>
const FULL=[["消す","けす","matikan"],["忘れずに","わすれずに","jangan lupa"],["クールビズ","クールビズ","Cool Biz"],["実施中","じっしちゅう","berlangsung"],["軽装","けいそう","ringan"],["ノー～","ノー～","tanpa"],["設定","せってい","setting"],["ご理解とご協力のほど","ごりかいとごきょうりょく","mohon pengerti"],["節電","せつでん","hemat listrik"],["両面印刷","りょうめんいんさつ","2 sisi"],["マイバッグ","マイバッグ","tas belanja"],["レジ袋","レジぶくろ","kantong"],["有料化","ゆうりょうか","berbayar"],["持参","じさん","bawa"],["環境","かんきょう","lingkungan"],["エコ","エコ","eco"],["節電する","せつでんする","hemat listrik"],["節水する","せっすいする","hemat air"],["紙","かみ","kertas"],["節約する","せつやくする","hemat"],["リサイクルする","リサイクルする","daur ulang"],["ごみ","ごみ","sampah"],["分別する","ぶんべつする","pilah"],["減らす","へらす","kurangi"],["設定温度","せっていおんど","set suhu"],["下げる","さげる","turunkan"],["もったいない","もったいない","mubazir"],["缶","かん","kaleng"],["まとめる","まとめる","kumpulkan"],["出す","だす","buang"],["洗剤","せんざい","detergen"],["止める","とめる","tutup"],["すすぐ","すすぐ","bilas"],["ストロー","ストロー","sedotan"],["マイ～","マイ～","my"],["持ち歩く","もちあるく","bawa"],["マイボトル","マイボトル","botol pribadi"],["ペットボトル","ペットボトル","botol plastik"],["資源","しげん","daur ulang"],["分け方","わけかた","cara pilah"],["出し方","だしかた","cara buang"],["集積所","しゅうせきじょ","titik kumpul"],["収集日","しゅうしゅうび","hari kumpul"],["資源ごみ","しげんごみ","daur"],["～種類","～しゅるい","jenis"],["分ける","わける","pilah"],["ひも","ひも","tali"],["しばる","しばる","ikat"],["新聞","しんぶん","koran"],["雑誌","ざっし","majalah"],["中身","なかみ","isi"],["びん","びん","botol kaca"],["キャップ","キャップ","tutup"],["ラベル","ラベル","label"],["つぶす","つぶす","hancur"],["紙パック","かみパック","karton"],["切り開く","きりひらく","potong buka"],["食品トレイ","しょくひんトレイ","nampan"],["可燃ごみ","かねんごみ","bakar"],["生ごみ","なまごみ","makanan"],["水を切る","みずをきる","keringkan"],["布","ぬの","kain"],["しみこませる","しみこませる","serap"],["固める","かためる","padat"],["プラスチック","プラスチック","plastik"],["再生","さいせい","daur ulang"],["少量","しょうりょう","sedikit"],["植木","うえき","tanaman"],["枝","えだ","cabang"],["葉","は","daun"],["使い古し","つかいふるし","bekas"],["凝固剤","ぎょうこざい","pemadat"],["ビニール","ビニール","vinil"],["～類","～るい","jenis"],["ラップ","ラップ","wrap"],["容器","ようき","wadah"],["発泡スチロール","はっぽうスチロール","styrofoam"],["不燃ごみ","ふねんごみ","tidak bakar"],["割れる","われる","pecah"],["包む","つつむ","bungkus"],["危険","きけん","bahaya"],["乾電池","かんでんち","baterai"],["刃物","はもの","tajam"],["ガラス","ガラス","kaca"],["陶磁器","とうじき","keramik"],["電球","でんきゅう","bohlam"],["アルミ製品","アルミせいひん","alumunium"],["金属","きんぞく","logam"],["家電製品","かでんせいひん","elektronik"],["粗大ごみ","そだいごみ","besar"],["家具","かぐ","furnitur"],["寝具","しんぐ","tidur"],["牛乳パック","ぎゅうにゅうパック","karton susu"],["使い切る","つかいきる","habis"],["燃える","もえる","bakar"],["取る","とる","lepas"],["出す","だす","buang"],["粗大ごみ受付センター","そだいごみうけつけセンター","pusat sampah"],["大きさ","おおきさ","ukuran"],["シール","シール","stiker"],["貼る","はる","tempel"]];let O=[],D=[],i=0,curBab=15;function showParts(){app.style.display='none';hub.style.display='block'}function init(){const t=FULL.length;babTitle.textContent='BAB '+curBab+' - '+t+' KATA';babDesc.textContent=curBab==16?'BAB 16 = 3 PART':'BAB '+curBab+' = 2 PART';let h=`<div class=partBtn full onclick="startBab('full')"><b>⭐ FULL ${t} KATA</b><span>></span></div>`;if(curBab==16){h+=`<div class=partBtn onclick="startBab('p1')"><b>PART 1 (1-65)</b><span>65 ></span></div><div class=partBtn onclick="startBab('p2')"><b>PART 2 (66-130)</b><span>65 ></span></div><div class=partBtn onclick="startBab('p3')"><b>PART 3 (131-${t})</b><span>${t-130} ></span></div>`}else{let m=Math.ceil(t/2);h+=`<div class=partBtn onclick="startBab('p1')"><b>PART 1 (1-${m})</b><span>${m} ></span></div><div class=partBtn onclick="startBab('p2')"><b>PART 2 (${m+1}-${t})</b><span>${t-m} ></span></div>`}partList.innerHTML=h;}function sz(t){return t.length<=2?66:t.length<=3?52:t.length<=5?40:t.length<=8?28:19}function ysz(t){return t.length>14?14:t.length>9?18:24}function render(){prog.textContent=(i+1)+' / '+D.length+' • BAB '+curBab;jpF.textContent=D[i][0];jpF.style.fontSize=sz(D[i][0])+'px';yomiB.textContent=D[i][1];yomiB.style.fontSize=ysz(D[i][1])+'px';trB.textContent=D[i][2];card.classList.remove('flipped');dots.innerHTML='';for(let k=0;k<D.length;k++){let d=document.createElement('div');d.className='dot'+(k==i?' active':'');dots.appendChild(d)}}
window.startBab=function(m){if(m==='full')O=[...FULL];else if(m==='p1'){if(curBab==16)O=FULL.slice(0,65);else O=FULL.slice(0,Math.ceil(FULL.length/2))}else if(m==='p2'){if(curBab==16)O=FULL.slice(65,130);else O=FULL.slice(Math.ceil(FULL.length/2))}else if(m==='p3')O=FULL.slice(130);D=[...O];i=0;hub.style.display='none';app.style.display='flex';render()}
window.acak=()=>{i=Math.floor(Math.random()*D.length);render()};window.hafal=()=>{D.splice(i,1);if(!D.length){jpF.textContent="🎉";jpF.style.fontSize="60px";yomiB.textContent="KANPEKI!";trB.textContent="Hafal BAB "+curBab+"!";prog.textContent="0 / 0";dots.innerHTML='';return}if(i>=D.length)i=0;render()};window.resetAll=()=>{D=[...O];i=0;render()};
let sx=0,cx=0,drag=false;const wrap=document.getElementById('wrap'),card=document.getElementById('card');card.addEventListener('click',()=>{if(!drag)card.classList.toggle('flipped')});function next(){i=(i+1)%D.length;render()}function prev(){i=(i-1+D.length)%D.length;render()}wrap.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;drag=false},{passive:true});wrap.addEventListener('touchmove',e=>{if(!sx)return;cx=e.touches[0].clientX-sx;if(Math.abs(cx)>10)drag=true},{passive:true});wrap.addEventListener('touchend',()=>{if(!drag){sx=0;return}if(cx<-50)next();else if(cx>50)prev();sx=0;cx=0;setTimeout(()=>drag=false,70)});init();</script></body></html>
