<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L13 FULL 88</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{background:#050505;color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 12px;font-family:monospace}h1{color:#facc15;font-size:17px;text-align:center}h1 small{color:#555;font-size:10px;display:block;margin-top:3px}#prog{color:#666;margin:10px 0;font-size:12px}#wrap{width:100%;max-width:380px;aspect-ratio:3/4.2;perspective:1000px}#card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.38s;cursor:pointer}#card.flipped{transform:rotateY(180deg)}.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;background:#111;border:1.5px solid #2a2a2a;border-radius:22px;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center}#jpF{font-family:'Noto Sans JP',sans-serif;font-weight:700;color:#fff;line-height:1.15;word-break:break-word;text-align:center}#yomiB{font-family:'Noto Sans JP',sans-serif;font-weight:700;color:#facc15;line-height:1.15;text-align:center}#trB{color:#888;margin-top:8px;line-height:1.3;font-size:12px;text-align:center}.back{transform:rotateY(180deg);flex-direction:column}.dots{display:flex;gap:3px;margin-top:10px;flex-wrap:wrap;justify-content:center;max-width:380px}.dot{width:4px;height:4px;border-radius:50%;background:#222}.dot.active{background:#facc15}.btns{width:100%;max-width:380px;margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}button{padding:13px;border-radius:12px;background:transparent;font-size:12px;border:1.5px solid;font-family:monospace}.b1{border-color:#fff;color:#fff}.b2{border-color:#22c55e;color:#22c55e}.b3{grid-column:1/-1;border-color:#333;color:#444}</style></head><body><h1>IRODORI L13 FULL 88 KATA<small>いろいろな資料を展示してあります</small></h1><div id="prog">1 / 88</div><div id="wrap"><div id="card"><div class="face front"><div id="jpF">公共</div></div><div class="face back"><div id="yomiB">こうきょう</div><div id="trB">publik</div></div></div></div><div class="dots" id="dots"></div><div class="btns"><button class="b1" onclick="acak()">🎲 Acak</button><button class="b2" onclick="hafal()">✅ Hafal</button><button class="b3" onclick="resetAll()">↺ Reset</button></div><script>const O=[["公共","こうきょう","publik"],["施設","しせつ","fasilitas"],["図書館","としょかん","perpustakaan"],["美術館","びじゅつかん","museum seni"],["民俗資料館","みんぞくしりょうかん","museum rakyat"],["体育館","たいいくかん","gimnasium"],["スポーツジム","スポーツジム","pusat kebugaran"],["お風呂","おふろ","ruang berendam"],["入浴施設","にゅうよくしせつ","ruang mandi"],["インフォメーションコーナー","インフォメーションコーナー","pojok informasi"],["プラネタリウム","プラネタリウム","planetarium"],["物産コーナー","ぶっさんコーナー","pojok produk"],["市内","しない","dalam kota"],["パンフレット","パンフレット","pamflet"],["外国語","がいこくご","bahasa asing"],["CD","シーディー","CD"],["昔","むかし","dahulu"],["道具","どうぐ","peralatan"],["文化施設","ぶんかしせつ","pusat kebudayaan"],["建てる","たてる","mendirikan"],["メイン","メイン","utama"],["PC","ピーシー","PC"],["自由に","じゆうに","dengan bebas"],["展示する","てんじする","memamerkan"],["歴史","れきし","sejarah"],["利用する","りようする","menggunakan"],["室内用","しつないよう","untuk dalam ruangan"],["オリエンテーション","オリエンテーション","orientasi"],["延長料金","えんちょうりょうきん","biaya perpanjangan"],["～につき","～につき","untuk setiap ~"],["かかる","かかる","dikenakan biaya"],["下りる","おりる","turun"],["シューズ","シューズ","sepatu"],["マシン","マシン","mesin"],["トレーナー","トレーナー","pelatih"],["～ほど","～ほど","sekitar ~"],["受ける","うける","menerima"],["声をかける","こえをかける","menyapa"],["ご了承ください","ごりょうしょうください","mohon dicatat (sopan)"],["受けていただきます","うけていただきます","mohon ikuti (sopan)"],["絵","え","lukisan"],["さまざま","さまざま","berbagai macam"],["彫刻","ちょうこく","ukiran"],["画家","がか","pelukis"],["～を中心に","～をちゅうしんに","utamanya"],["セット券","セットけん","tiket terusan"],["フラッシュ","フラッシュ","blitz; lampu kilat"],["券売機","けんばいき","mesin tiket"],["休憩室","きゅうけいしつ","lounge; ruang santai"],["ついている","ついている","termasuk ~"],["IT","アイティー","IT"],["利用者カード","りようしゃカード","kartu pengguna"],["プリントアウト","プリントアウト","print-out"],["インターネット","インターネット","internet"],["プリンター","プリンター","printer"],["空いている","あいている","kosong"],["確認する","かくにんする","mengecek"],["在留カード","ざいりゅうカード","kartu izin tinggal"],["何冊","なんさつ","berapa buku"],["～冊","～さつ","~ jilid"],["合わせて","あわせて","total"],["～点","～てん","~ item"],["飲食禁止","いんしょくきんし","larangan makan minum"],["返す","かえす","mengembalikan"],["閉まる","しまる","tutup"],["返却ポスト","へんきゃくポスト","kotak pengembalian"],["開く","あく","buka"],["返却","へんきゃく","pengembalian"],["お読みください","およみください","silakan baca"],["延ばす","のばす","memperpanjang"],["～のうち","～のうち","dalam ~"],["カセットテープ","カセットテープ","kaset"],["～禁止","～きんし","larangan ~"],["立入禁止","たちいりきんし","dilarang masuk"],["関係者","かんけいしゃ","staf berwenang"],["～以外","～いがい","kecuali ~"],["預ける","あずける","menitipkan"],["お預けください","おあずけください","silakan titip (sopan)"],["館内","かんない","di dalam gedung"],["通話","つうわ","panggilan"],["ご遠慮ください","ごえんりょください","mohon jangan"],["お控えください","おひかえください","mohon jangan"],["入館","にゅうかん","masuk gedung"],["入れ墨","いれずみ","tato Jepang"],["タトゥー","タトゥー","tato"],["シール","シール","stiker tato"],["ボディペイント","ボディペイント","body paint"],["お断りしています","おことわりしています","kami menolak ~ (sopan)"]];let D=[...O],i=0;function sz(t){let l=t.length;if(l<=2)return 68;if(l<=3)return 58;if(l<=5)return 42;if(l<=9)return 30;if(l<=13)return 24;return 20}function ysz(t){let l=t.length;if(l<=6)return 36;if(l<=10)return 26;return 18}function render(){prog.textContent=(i+1)+" / "+D.length;jpF.textContent=D[i][0];jpF.style.fontSize=sz(D[i][0])+"px";yomiB.textContent=D[i][1];yomiB.style.fontSize=ysz(D[i][1])+"px";trB.textContent=D[i][2];card.classList.remove('flipped');dots.innerHTML='';for(let k=0;k<D.length;k++){let d=document.createElement('div');d.className='dot'+(k==i?' active':'');dots.appendChild(d)}}card.addEventListener('click',()=>{if(!drag)return card.classList.toggle('flipped')});function next(){i=(i+1)%D.length;render()}function prev(){i=(i-1+D.length)%D.length;render()}window.acak=()=>{i=Math.floor(Math.random()*D.length);render()};window.hafal=()=>{D.splice(i,1);if(!D.length){jpF.textContent="🎉";jpF.style.fontSize="64px";yomiB.textContent="KANPEKI!";trB.textContent="88 hafal!";prog.textContent="0 / 0";dots.innerHTML='';return}if(i>=D.length)i=0;render()};window.resetAll=()=>{D=[...O];i=0;render()};let sx=0,cx=0,drag=false;wrap.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;drag=false},{passive:true});wrap.addEventListener('touchmove',e=>{if(!sx)return;cx=e.touches[0].clientX-sx;if(Math.abs(cx)>10)drag=true},{passive:true});wrap.addEventListener('touchend',()=>{if(!drag){sx=0;return}if(cx<-50)next();else if(cx>50)prev();sx=0;cx=0;setTimeout(()=>drag=false,70)});render();</script></body></html>
