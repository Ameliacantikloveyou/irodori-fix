<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRODORI L13</title><style>@import url('https://fonts.googleapis.com/css2?family=Courier+Prime&family=Noto+Sans+JP:wght@700&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{background:#050505;color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 14px;font-family:'Courier Prime',monospace}h1{color:#facc15;font-size:20px;letter-spacing:2px;text-align:center;line-height:1.25}h1 small{color:#888;font-size:11px;display:block;margin-top:4px}#prog{color:#555;margin:12px 0 20px;font-size:13px}.card{width:100%;max-width:380px;aspect-ratio:3/4.1;background:#111;border:1.6px solid #333;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;cursor:pointer}.jp{font-family:'Noto Sans JP',sans-serif;font-size:32px;font-weight:700;color:#fff;line-height:1.3}.yomi{font-size:14px;color:#facc15;margin-top:10px}.id{font-size:13px;color:#666;margin-top:18px}.btns{width:100%;max-width:380px;margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}button{padding:15px 10px;border-radius:12px;background:transparent;font-size:13px;font-family:'Courier Prime',monospace}.b1{border:1.5px solid #fff;color:#fff}.b2{border:1.5px solid #22c55e;color:#22c55e}.b3{grid-column:1/-1;border:1.5px solid #ef4444;color:#ef4444;margin-top:4px}</style></head><body><h1>IRODORI A2.2 - B<br>PART 2 <small>L13 いろいろな資料を展示してあります</small></h1><div id="prog">1 / 25</div><div class="card" id="card" onclick="flip()"><div class="jp" id="jp">公共</div><div class="yomi" id="yomi">こうきょう</div><div class="id" id="tr">publik</div></div><div class="btns"><button class="b1" onclick="acak()">🎲 Acak Kartu</button><button class="b2" onclick="hafal()">✅ Sudah Hafal</button><button class="b3" onclick="location.reload()">← Reset</button></div><script>const DATA=[["公共","こうきょう","publik"],["施設","しせつ","fasilitas"],["図書館","としょかん","perpustakaan"],["美術館","びじゅつかん","museum seni"],["民俗資料館","みんぞくしりょうかん","museum rakyat"],["体育館","たいいくかん","gimnasium"],["スポーツジム","スポーツジム","pusat kebugaran"],["お風呂","おふろ","ruang berendam"],["入浴施設","にゅうよくしせつ","ruang mandi"],["インフォメーションコーナー","インフォメーションコーナー","pojok layanan informasi"],["プラネタリウム","プラネタリウム","planetarium"],["物産コーナー","ぶっさんコーナー","pojok produk"],["市内","しない","dalam kota"],["パンフレット","パンフレット","pamflet"],["外国語","がいこくご","bahasa asing"],["CD","シーディー","CD"],["昔","むかし","dahulu"],["道具","どうぐ","peralatan"],["文化施設","ぶんかしせつ","pusat kebudayaan"],["建てる","たてる","mendirikan"],["メイン","メイン","utama"],["PC","ピーシー","personal computer"],["自由に","じゆうに","dengan bebas"],["展示する","てんじする","memamerkan"],["歴史","れきし","sejarah"]];let idx=0,showJP=true;function render(){prog.textContent=(idx+1)+" / "+DATA.length;jp.textContent=showJP?DATA[idx][0]:DATA[idx][2];yomi.textContent=showJP?DATA[idx][1]:DATA[idx][0]+" • "+DATA[idx][1];tr.textContent=showJP?DATA[idx][2]:"tap untuk balik"}function flip(){showJP=!showJP;render()}function acak(){idx=Math.floor(Math.random()*DATA.length);showJP=true;render()}function hafal(){DATA.splice(idx,1);if(!DATA.length){jp.textContent="🎉";yomi.textContent="SUGOI!";tr.textContent="semua hafal!";return}if(idx>=DATA.length)idx=0;showJP=true;render()}render();</script></body></html>
