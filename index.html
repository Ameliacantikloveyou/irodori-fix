<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRODORI L13</title><style>@import url('https://fonts.googleapis.com/css2?family=Courier+Prime&family=Noto+Sans+JP:wght@700&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{background:#050505;color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 14px;font-family:'Courier Prime',monospace}h1{color:#facc15;font-size:20px;letter-spacing:2px;text-align:center}h1 small{color:#666;font-size:11px;display:block;margin-top:4px}#prog{color:#555;margin:12px 0 16px;font-size:13px}.card-wrap{width:100%;max-width:380px;aspect-ratio:3/4.2;perspective:1000px}.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.45s;cursor:pointer}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;background:#111;border:1.6px solid #333;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}.front.jp{font-family:'Noto Sans JP',sans-serif;font-size:52px;color:#fff}.front.hint{font-size:10px;color:#3a3a3a;margin-top:24px}.back{transform:rotateY(180deg)}.back.yomi{font-family:'Noto Sans JP',sans-serif;font-size:38px;color:#facc15;font-weight:700}.back.id{font-size:16px;color:#999;margin-top:16px}.back.kanji-mini{font-size:11px;color:#333;margin-top:22px}.dots{display:flex;gap:6px;margin-top:14px}.dot{width:5px;height:5px;border-radius:50%;background:#222}.dot.active{background:#facc15}.btns{width:100%;max-width:380px;margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}button{padding:15px 10px;border-radius:12px;background:transparent;font-size:13px;font-family:'Courier Prime',monospace;border:1.5px solid}.b1{border-color:#fff;color:#fff}.b2{border-color:#22c55e;color:#22c55e}.b3{grid-column:1/-1;border-color:#ef4444;color:#ef4444}</style></head><body><h1>IRODORI A2.2 - B PART 2<small>L13</small></h1><div id="prog">1 / 25</div><div class="card-wrap" id="wrap"><div class="card" id="card"><div class="face front"><div class="jp" id="jpF">公共</div><div class="hint">TAP = FLIP • GESER = PINDAH</div></div><div class="face back"><div class="yomi" id="yomiB">こうきょう</div><div class="id" id="trB">publik</div><div class="kanji-mini" id="kanjiB">公共</div></div></div></div><div class="dots" id="dots"></div><div class="btns"><button class="b1" onclick="acak()">🎲 Acak Kartu</button><button class="b2" onclick="hafal()">✅ Sudah Hafal</button><button class="b3" onclick="resetAll()">← Reset</button></div><script>const ORIGINAL=[["公共","こうきょう","publik"],["施設","しせつ","fasilitas"],["図書館","としょかん","perpustakaan"],["美術館","びじゅつかん","museum seni"],["民俗資料館","みんぞくしりょうかん","museum rakyat"],["体育館","たいいくかん","gimnasium"],["スポーツジム","スポーツジム","pusat kebugaran"],["お風呂","おふろ","ruang berendam"],["入浴施設","にゅうよくしせつ","ruang mandi"],["インフォメーションコーナー","インフォメーションコーナー","pojok info"],["プラネタリウム","プラネタリウム","planetarium"],["物産コーナー","ぶっさんコーナー","pojok produk"],["市内","しない","dalam kota"],["パンフレット","パンフレット","pamflet"],["外国語","がいこくご","bahasa asing"],["CD","シーディー","CD"],["昔","むかし","dahulu"],["道具","どうぐ","peralatan"],["文化施設","ぶんかしせつ","pusat kebudayaan"],["建てる","たてる","mendirikan"],["メイン","メイン","utama"],["PC","ピーシー","PC"],["自由に","じゆうに","dengan bebas"],["展示する","てんじする","memamerkan"],["歴史","れきし","sejarah"]];let DATA=[...ORIGINAL],idx=0;const card=document.getElementById('card'),wrap=document.getElementById('wrap');function render(){prog.textContent=(idx+1)+" / "+DATA.length;jpF.textContent=DATA[idx][0];yomiB.textContent=DATA[idx][1];trB.textContent=DATA[idx][2];kanjiB.textContent=DATA[idx][0];card.classList.remove('flipped');updateDots()}function updateDots(){dots.innerHTML='';for(let i=0;i<DATA.length;i++){let d=document.createElement('div');d.className='dot'+(i==idx?' active':'');dots.appendChild(d)}}card.addEventListener('click',()=>{if(!dragging)card.classList.toggle('flipped')});function next(){idx=(idx+1)%DATA.length;render()}function prev(){idx=(idx-1+DATA.length)%DATA.length;render()}function acak(){idx=Math.floor(Math.random()*DATA.length);render()}function hafal(){DATA.splice(idx,1);if(!DATA.length){jpF.textContent="🎉";yomiB.textContent="SUGOI!";trB.textContent="semua hafal";prog.textContent="0 / 0";dots.innerHTML='';return}if(idx>=DATA.length)idx=0;render()}function resetAll(){DATA=[...ORIGINAL];idx=0;render()}let startX=0,curX=0,dragging=false;wrap.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;dragging=false},{passive:true});wrap.addEventListener('touchmove',e=>{if(!startX)return;curX=e.touches[0].clientX-startX;if(Math.abs(curX)>10)dragging=true},{passive:true});wrap.addEventListener('touchend',()=>{if(!dragging){startX=0;return}if(curX<-60)next();else if(curX>60)prev();startX=0;curX=0;setTimeout(()=>dragging=false,100)});render();</script></body></html>
