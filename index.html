<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAB 17 - FIX 2 PART</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&family=JetBrains+Mono:wght@400;700&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{background:#050505;color:#eee;min-height:100vh;font-family:'JetBrains Mono',monospace;display:flex;flex-direction:column;align-items:center;padding:20px 14px}#menu{width:100%;max-width:420px;margin-top:14vh;text-align:center}#menu h1{color:#a78bfa;font-size:20px}#menu p{color:#555;font-size:11px;margin-top:6px;letter-spacing:2px}.cardBtn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-radius:14px;border:1.5px solid #333;background:#111;margin-top:10px;cursor:pointer}.cardBtn b{font-size:12px}.cardBtn.full{border-color:#a78bfa;background:rgba(167,139,250,0.12);color:#a78bfa;margin-top:24px}#app{width:100%;max-width:400px;display:none;flex-direction:column;align-items:center}#top{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}#top button{background:transparent;border:1px solid #333;color:#666;border-radius:8px;padding:6px 12px;font-family:monospace}#prog{color:#555;font-size:11px}#wrap{width:100%;aspect-ratio:3/4.2;perspective:1000px}#card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.38s;cursor:pointer}#card.flipped{transform:rotateY(180deg)}.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;background:#111;border:1.5px solid #2a2a2a;border-radius:22px;display:flex;align-items:center;justify-content:center;padding:14px;text-align:center}#jpF{font-family:'Noto Sans JP',sans-serif;font-weight:700;color:#fff;line-height:1.15}#yomiB{font-family:'Noto Sans JP',sans-serif;font-weight:700;color:#a78bfa;line-height:1.15}#trB{color:#888;margin-top:6px;font-size:11px}.back{transform:rotateY(180deg);flex-direction:column}.dots{display:flex;gap:2px;margin-top:10px;flex-wrap:wrap;justify-content:center}.dot{width:3px;height:3px;border-radius:50%;background:#222}.dot.active{background:#a78bfa}.btns{width:100%;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}button.action{padding:12px;border-radius:10px;background:transparent;font-size:11px;border:1.5px solid;font-family:monospace}.b1{border-color:#fff;color:#fff}.b2{border-color:#22c55e;color:#22c55e}.b3{grid-column:1/-1;border-color:#333;color:#444}</style></head><body><div id="menu"><h1>BAB 17 - 26 KATA</h1><p>日本語が前より話せるように - 2 PART</p><div class="cardBtn full" onclick="start('full')"><b>⭐ FULL 26 KATA</b><span>></span></div><div class="cardBtn" onclick="start('p1')"><b>PART 1 (1-13)</b><span>13 ></span></div><div class="cardBtn" onclick="start('p2')"><b>PART 2 (14-26)</b><span>13 ></span></div></div><div id="app"><div id="top"><button onclick="showMenu()">← MENU</button><div id="prog"></div><div style="width:60px"></div></div><div id="wrap"><div id="card"><div class="face front"><div id="jpF"></div></div><div class="face back"><div id="yomiB"></div><div id="trB"></div></div></div></div><div class="dots" id="dots"></div><div class="btns"><button class="action b1" onclick="acak()">🎲 Acak</button><button class="action b2" onclick="hafal()">✅ Hafal</button><button class="action b3" onclick="resetAll()">↺ Reset</button></div></div><script>const FULL=[["和太鼓","わだいこ","taiko"],["サークル","サークル","klub"],["入る","はいる","ikut"],["誘う","さそう","mengajak"],["おかげで","おかげで","berkat"],["増える","ふえる","bertambah"],["ゲストハウス","ゲストハウス","guest house"],["SNS","エスエヌエス","medsos"],["やりとり","やりとり","interaksi"],["～以外","～いがい","selain"],["うまい","うまい","pintar"],["ドラマ","ドラマ","drama"],["ほとんど","ほとんど","kebanyakan"],["セリフ","セリフ","dialog"],["アイディア","アイディア","ide"],["笑う","わらう","tertawa"],["そろそろ","そろそろ","hampir"],["～のころ","～のころ","saat"],["苦労する","くろうする","kesulitan"],["締め日","しめび","batas transaksi"],["納期","のうき","batas kirim"],["友だちリクエスト","ともだちリクエスト","request teman"],["承認する","しょうにんする","setujui"],["授業","じゅぎょう","pelajaran"],["問題","もんだい","masalah"],["感謝する","かんしゃする","terima kasih"]];let O=[],D=[],i=0;function sz(t){return t.length<=2?66:t.length<=4?44:t.length<=8?30:20}function ysz(t){return t.length>12?16:26}function render(){prog.textContent=(i+1)+" / "+D.length;jpF.textContent=D[i][0];jpF.style.fontSize=sz(D[i][0])+"px";yomiB.textContent=D[i][1];yomiB.style.fontSize=ysz(D[i][1])+"px";trB.textContent=D[i][2];card.classList.remove('flipped');dots.innerHTML='';for(let k=0;k<D.length;k++){let d=document.createElement('div');d.className='dot'+(k==i?' active':'');dots.appendChild(d)}}window.showMenu=function(){document.getElementById('menu').style.display='block';document.getElementById('app').style.display='none'};window.start=function(m){if(m==='full')O=[...FULL];if(m==='p1')O=FULL.slice(0,13);if(m==='p2')O=FULL.slice(13);D=[...O];i=0;document.getElementById('menu').style.display='none';document.getElementById('app').style.display='flex';render()};window.acak=()=>{i=Math.floor(Math.random()*D.length);render()};window.hafal=()=>{D.splice(i,1);if(!D.length){jpF.textContent="🎉";jpF.style.fontSize="60px";yomiB.textContent="KANPEKI!";trB.textContent="Hafal!";prog.textContent="0 / 0";dots.innerHTML='';return}if(i>=D.length)i=0;render()};window.resetAll=()=>{D=[...O];i=0;render()};let sx=0,cx=0,drag=false;const wrap=document.getElementById('wrap'),card=document.getElementById('card');card.addEventListener('click',()=>{if(!drag)card.classList.toggle('flipped')});function next(){i=(i+1)%D.length;render()}function prev(){i=(i-1+D.length)%D.length;render()}wrap.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;drag=false},{passive:true});wrap.addEventListener('touchmove',e=>{if(!sx)return;cx=e.touches[0].clientX-sx;if(Math.abs(cx)>10)drag=true},{passive:true});wrap.addEventListener('touchend',()=>{if(!drag){sx=0;return}if(cx<-50)next();else if(cx>50)prev();sx=0;cx=0;setTimeout(()=>drag=false,70)});</script></body></html>
