<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>html,body{overscroll-behavior:none}body{margin:0;background:#000;color:#eee;min-height:100dvh;font-family:ui-monospace,monospace;display:flex;flex-direction:column} #hub{display:none;padding:20px} #hub button{background:transparent;border:1px solid #333;color:#666;padding:8px 14px;border-radius:20px} #app{flex:1;display:flex;flex-direction:column;padding:10px} #top{display:flex;justify-content:space-between;align-items:center;color:#666;font-size:12px} #top button{background:#111;border:1px solid #333;color:#fff;padding:6px 14px;border-radius:20px} #prog{color:#444} #wrap{flex:1;display:flex;justify-content:center;align-items:center;perspective:1000px;margin:10px 0} #card{width:100%;max-width:400px;height:380px;position:relative;transform-style:preserve-3d;transition:.5s} #card.flipped{transform:rotateY(180deg)} .face{position:absolute;inset:0;background:#0a0a0a;border:1px solid #222;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;backface-visibility:hidden} .back{transform:rotateY(180deg)} .kanji{font-size:72px;font-weight:bold;line-height:1} .yomi{color:#ffeb3b;margin-top:14px;font-size:22px} .arti{color:#888;margin-top:8px;font-size:16px} #ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px} #ctrl button{padding:14px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;font-weight:bold} #furiBtn{color:#6ea8fe;border-color:#2a4a8a} #hafalBtn{color:#4caf50} #title{font-size:12px;color:#333;text-align:center;margin-top:8px}</style></head><body>
<div id="hub"><button onclick="location.href='index.html'">← HUB</button><div style="margin-top:20px;color:#666">Pilih PART akan muncul disini</div></div>
<div id="app"><div id="top"><button onclick="showParts()">← PART</button><div id="prog"></div><button onclick="location.href='index.html'">HUB</button></div>
<div id="wrap"><div id="card" class="card"><div class="face front"><div id="frontK" class="kanji"></div><div id="frontT" style="color:#222;font-size:10px;margin-top:20px">tap untuk balik</div></div><div class="face back"><div id="backK" class="kanji" style="font-size:36px"></div><div id="backY" class="yomi"></div><div id="backA" class="arti"></div></div></div></div>
<div id="ctrl"><button onclick="acak()">🎲 Acak</button><button id="hafalBtn" onclick="hafal()">✅ Hafal</button><button onclick="speakNow()">🔊 Arti</button><button id="furiBtn" onclick="toggleFuri()">ふりがな ON</button></div>
<div id="title"></div></div>
<script>
const FULL=[
["市","し","kota"],["借りる","かりる","meminjam"],["料金","りょうきん","biaya"],["返す","かえす","mengembalikan"],["図書館","としょかん","perpustakaan"],["開く","あく","terbuka"],["道具","どうぐ","perkakas"],["閉まる","しまる","tertutup"],["～点","～てん","poin"],["利用する","りようする","memanfaatkan"],["必要","ひつよう","perlu"],
["外国","がいこく","luar negeri"],["郵便局","ゆうびんきょく","kantor pos"],["情報","じょうほう","informasi"],["近所","きんじょ","sekitar"],["相談","そうだん","konsultasi"],["自動","じどう","otomatis"],["質問","しつもん","pertanyaan"],["洗う","あらう","mencuci"],["窓口","まどぐち","loket"],["入力する","にゅうりょくする","input data"],
["温度","おんど","suhu"],["出す","だす","mengeluarkan"],["危険","きけん","bahaya"],["分ける","わける","membagi"],["種類","しゅるい","jenis"],["燃える","もえる","terbakar"],["消す","けす","mematikan"],["決める","きめる","memutuskan"],["捨てる","すてる","membuang"],["設定する","せっていする","mengatur"],
["地震","じしん","gempa"],["大切","たいせつ","penting"],["台風","たいふう","topan"],["心配","しんぱい","khawatir"],["外","そと","luar"],["集まる","あつまる","berkumpul"],["声","こえ","suara"],["進む","すすむ","maju"],["危ない","あぶない","berbahaya"],
["最近","さいきん","akhir-akhir ini"],["違う","ちがう","berbeda"],["授業","じゅぎょう","pelajaran"],["慣れる","なれる","terbiasa"],["問題","もんだい","masalah"],["増える","ふえる","bertambah"],["大変","たいへん","susah sekali"],["笑う","わらう","tertawa"],["困る","こまる","kesulitan"],["苦労する","くろうする","bersusah payah"],
["希望","きぼう","harapan"],["続ける","つづける","melanjutkan"],["募集","ぼしゅう","lowongan"],["考える","かんがえる","berpikir"],["特に","とくに","khususnya"],["役に立つ","やくにたつ","berguna"],["住む","すむ","tinggal"],["卒業する","そつぎょうする","lulus"],["建てる","たてる","membangun"],["留学する","りゅうがくする","studi luar negeri"]
];
let D=[],I=0,lastR=0,isRandom=false,furiOn=true;
function showParts(){document.getElementById('app').style.display='none';document.getElementById('hub').style.display='block';speechSynthesis.cancel();}
function init(){D=FULL.length;babTitle();textContent();upDF();render();}
function babTitle(){document.getElementById('title').textContent=FULL.length+' KATA • BAB 14 - '+FULL.length+' KATA';}
function upDF(){let b=document.getElementById('furiBtn');b.textContent=furiOn?'ふりがな ON':'ふりがな OFF';b.className=furiOn?'':'off';}
window.toggleFuri=function(){furiOn=!furiOn;upDF();render();}
function sz(t){return t.length>=2780?t.length=3764:t.length>=5748?t.length=8732:22;}
function speakNow(){if(D.length)return;let txt=isRandom?FULL[lastR][2]:FULL[I][2];let u=new SpeechSynthesisUtterance(txt);u.lang='id-ID';speechSynthesis.cancel();speechSynthesis.speak(u);}
function render(){let k,y,tr;if(isRandom){let prog=document.getElementById('prog');prog.textContent='1 / '+D.length+' • BAB 14';k=D[lastR][0];y=D[lastR][0];tr=D[lastR];}else{k=FULL[I][0];y=FULL[I][0];tr=FULL[I];let prog=document.getElementById('prog');prog.textContent=(I+1)+' / '+D.length+' • BAB 14';}
document.getElementById('frontK').textContent=k;document.getElementById('backK').textContent=tr[0];document.getElementById('backY').textContent=furiOn?tr[1]:'';document.getElementById('backA').textContent=tr[2];}
window.flip=function(){document.getElementById('card').classList.toggle('flipped');}
window.acak=function(){let r=Math.floor(Math.random()*FULL.length);if(r==lastR)r=(r+1)%D;lastR=r;isRandom=true;render();}
window.hafal=function(){speechSynthesis.cancel();if(isRandom){D.splice(lastR,1);if(lastR>=D.length)lastR=0;if(D.length==0){lastR=0;D=FULL.slice();}isRandom=true;render();}else{if(I<D.length-1){I++;}else{I=0;}render();}}
let sy=0,cy=0,drag=false;const wrap=document.getElementById('wrap');wrap.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;drag=true});wrap.addEventListener('touchend',e=>{if(!drag)return;let ey=e.changedTouches[0].clientY;if(sy-ey>40)hafal();if(ey-sy>40)flip();drag=false});document.getElementById('card').addEventListener('click',flip);init();
</script></body></html>
