<!DOCTYPE html><html lang=id><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>BAB 18</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&family=JetBrains+Mono:wght@400;700&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{background:#050505;color:#eee;min-height:100vh;font-family:'JetBrains Mono',monospace;display:flex;flex-direction:column;align-items:center;padding:12px}#hub{width:100%;max-width:440px;text-align:center;margin-top:2vh}#hub h2{color:#ffeb00;font-size:18px}#hub p{color:#666;font-size:10px;margin:8px 0 14px}.partBtn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;border:1.5px solid #333;background:#111;margin-top:10px;cursor:pointer;font-size:12px}.partBtn.full{border-color:#ffeb00;background:rgba(255,235,0,0.15);color:#ffeb00;font-weight:700}#app{width:100%;max-width:400px;display:none;flex-direction:column;align-items:center;margin-top:1vh}#top{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}#top button{background:transparent;border:1px solid #333;color:#666;border-radius:8px;padding:6px 12px;font-family:monospace;font-size:11px}#prog{color:#666;font-size:11px}#wrap{width:100%;aspect-ratio:3/4.2;perspective:1000px}#card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.35s;cursor:pointer}#card.flipped{transform:rotateY(180deg)}.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;background:#111;border:1.5px solid #2a2a2a;border-radius:22px;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}#jpF{font-family:'Noto Sans JP',sans-serif;font-weight:700;color:#fff;line-height:1.15}#yomiB{font-family:'Noto Sans JP',sans-serif;font-weight:700;color:#ffeb00;line-height:1.15}#trB{color:#888;margin-top:6px;font-size:11px}.back{transform:rotateY(180deg);flex-direction:column}.dots{display:flex;gap:2px;margin-top:10px;flex-wrap:wrap;justify-content:center}.dot{width:3px;height:3px;border-radius:50%;background:#222}.dot.active{background:#ffeb00}.btns{width:100%;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}button.action{padding:12px;border-radius:10px;background:transparent;font-size:11px;border:1.5px solid;font-family:monospace}.b1{border-color:#fff;color:#fff}.b2{border-color:#22c55e;color:#22c55e}.b3{grid-column:1/-1;border-color:#333;color:#444}</style></head><body><div id=hub><button onclick="location.href='index.html'" style="background:transparent;border:1px solid #333;color:#666;border-radius:8px;padding:6px 12px;font-family:monospace;margin-bottom:12px">← HUB</button><h2 id=babTitle></h2><p id=babDesc></p><div id=partList></div></div><div id=app><div id=top><button onclick="showParts()">← PART</button><div id=prog></div><button onclick="location.href='index.html'" style="width:60px;background:transparent;border:1px solid #222;color:#444;border-radius:8px;padding:4px">HUB</button></div><div id=wrap><div id=card><div class="face front"><div id=jpF></div></div><div class="face back"><div id=yomiB></div><div id=trB></div></div></div></div><div class=dots id=dots></div><div class=btns><button class="action b1" onclick="acak()">🎲 Acak</button><button class="action b2" onclick="hafal()">✅ Hafal</button><button class="action b3" onclick="resetAll()">↺ Reset</button></div></div><script>
const FULL=[["手伝う","てつだう","bantu"],["手伝ってください","てつだってください","tolong bantu"],["荷物","にもつ","barang"],["重い","おもい","berat"],["軽い","かるい","ringan"],["持つ","もつ","bawa"],["運ぶ","はこぶ","angkut"],["届ける","とどける","antar"],["拾う","ひろう","pungut"],["落とす","おとす","jatuh"],["忘れる","わすれる","lupa"],["忘れ物","わすれもの","barang tertinggal"],["落し物","おとしもの","barang hilang"],["交番","こうばん","pos polisi"],["届ける","とどける","lapor"],["探す","さがす","cari"],["見つかる","みつかる","ketemu"],["連絡する","れんらくする","hubungi"],["困る","こまる","kesulitan"],["困っている","こまっている","kesusahan"],["道に迷う","みちにまよう","tersesat"],["助ける","たすける","tolong"],["助かる","たすかる","terbantu"],["親切","しんせつ","baik hati"],["ありがとうございます","ありがとうございます","terima kasih"],["すみません","すみません","maaf"],["お願いします","おねがいします","mohon"],["ちょっと","ちょっと","sebentar"],["大丈夫","だいじょうぶ","tidak apa"],["気を付ける","きをつける","hati-hati"],["注意する","ちゅういする","perhatikan"],["約束","やくそく","janji"],["守る","まもる","tepati"],["遅れる","おくれる","terlambat"],["待つ","まつ","tunggu"],["待たせる","またせる","membuat tunggu"],["謝る","あやまる","minta maaf"],["許す","ゆるす","maafkan"],["連絡","れんらく","kontak"],["電話","でんわ","telepon"],["メール","メール","email"],["メッセージ","メッセージ","pesan"],["返す","かえす","balas"],["返事","へんじ","jawaban"],["了解する","りょうかいする","mengerti"],["承知する","しょうちする","mengerti sopan"],["かしこまりました","かしこまりました","baik"]];let O=[],D=[],i=0,curBab=18;function showParts(){app.style.display='none';hub.style.display='block'}function init(){const t=FULL.length;babTitle.textContent='BAB '+curBab+' - '+t+' KATA';babDesc.textContent='BAB '+curBab+' = 2 PART';let h=`<div class=partBtn full onclick="startBab('full')"><b>⭐ FULL ${t} KATA</b><span>></span></div>`;let m=Math.ceil(t/2);h+=`<div class=partBtn onclick="startBab('p1')"><b>PART 1 (1-${m})</b><span>${m} ></span></div><div class=partBtn onclick="startBab('p2')"><b>PART 2 (${m+1}-${t})</b><span>${t-m} ></span></div>`;partList.innerHTML=h;}function sz(t){return t.length<=2?66:t.length<=3?52:t.length<=5?40:t.length<=8?28:19}function ysz(t){return t.length>14?14:t.length>9?18:24}function render(){prog.textContent=(i+1)+' / '+D.length+' • BAB '+curBab;jpF.textContent=D[i][0];jpF.style.fontSize=sz(D[i][0])+'px';yomiB.textContent=D[i][1];yomiB.style.fontSize=ysz(D[i][1])+'px';trB.textContent=D[i][2];card.classList.remove('flipped');dots.innerHTML='';for(let k=0;k<D.length;k++){let d=document.createElement('div');d.className='dot'+(k==i?' active':'');dots.appendChild(d)}}
window.startBab=function(m){if(m==='full')O=[...FULL];else if(m==='p1')O=FULL.slice(0,Math.ceil(FULL.length/2));else if(m==='p2')O=FULL.slice(Math.ceil(FULL.length/2));D=[...O];i=0;hub.style.display='none';app.style.display='flex';render()}
window.acak=()=>{i=Math.floor(Math.random()*D.length);render()};window.hafal=()=>{D.splice(i,1);if(!D.length){jpF.textContent="🎉";jpF.style.fontSize="60px";yomiB.textContent="KANPEKI!";trB.textContent="Hafal BAB "+curBab+"!";prog.textContent="0 / 0";dots.innerHTML='';return}if(i>=D.length)i=0;render()};window.resetAll=()=>{D=[...O];i=0;render()};
let sx=0,cx=0,drag=false;const wrap=document.getElementById('wrap'),card=document.getElementById('card');card.addEventListener('click',()=>{if(!drag)card.classList.toggle('flipped')});function next(){i=(i+1)%D.length;render()}function prev(){i=(i-1+D.length)%D.length;render()}wrap.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;drag=false},{passive:true});wrap.addEventListener('touchmove',e=>{if(!sx)return;cx=e.touches[0].clientX-sx;if(Math.abs(cx)>10)drag=true},{passive:true});wrap.addEventListener('touchend',()=>{if(!drag){sx=0;return}if(cx<-50)next();else if(cx>50)prev();sx=0;cx=0;setTimeout(()=>drag=false,70)});init();</script></body></html>
